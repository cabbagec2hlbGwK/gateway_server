<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>SQS Message Modal</title>
    <script>
        // Auto-refresh the page every 2 seconds only if there is no message
        window.onload = function() {
            const messageContent = "{{ message_body }}".trim();
            if (!messageContent) {
                setTimeout(function() {
                    location.reload();
                }, 1000);
            }
        };
    </script>
</head>
<body>
    <div class="modal modal-sheet position-static d-block bg-body-secondary p-4 py-md-5" tabindex="-1" role="dialog" id="modalChoice">
      <div class="modal-dialog" role="document">
        <div class="modal-content rounded-3 shadow">
          <div class="modal-body p-4 text-center">
            <h5 class="mb-0">Enable this setting?</h5>
            <p class="mb-0">{{ message_body }}</p>
          </div>
          <div class="modal-footer flex-nowrap p-0">
            <button type="button" class="btn btn-lg btn-link fs-6 text-decoration-none col-6 py-3 m-0 rounded-0 border-end" id="approveBtn"><strong>Approve</strong></button>
            <button type="button" class="btn btn-lg btn-link fs-6 text-decoration-none col-6 py-3 m-0 rounded-0" id="denyBtn">Deny</button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        function processAction(action) {
            $.ajax({
                url: "/process",
                type: "POST",
                contentType: "application/json",
                data: JSON.stringify({
                    "action": action,
                    "receipt_handle": "{{ receipt_handle }}"
                }),
                success: function(response) {
                    location.reload(); // Reload page to fetch new message
                }
            });
        }

        $(document).ready(function() {
            $('#approveBtn').click(function() {
                processAction('approve');
            });

            $('#denyBtn').click(function() {
                processAction('deny');
            });
        });
    </script>
</body>
</html>
